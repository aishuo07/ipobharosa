name: Filing financial extraction

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch: {}

jobs:
  extract-for-review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pdf-extractor/requirements.txt
      - run: pip install -r pdf-extractor/requirements.txt
      - name: Extract filing-backed candidates into review queue
        env:
          API_BASE: ${{ vars.SITE_URL || 'https://ipodekho-ten.vercel.app' }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_BEARER_TOKEN }}
        run: python pdf-extractor/worker.py
