name: IPO data ingestion

on:
  schedule:
    # Every 2 hours. Vercel's free Hobby plan only allows daily native
    # cron jobs, so this runs on GitHub Actions' free scheduler instead
    # and just hits the deployed, CRON_SECRET-protected API route.
    - cron: "0 */2 * * *"
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger ingestion cycle
        run: |
          for attempt in $(seq 1 50); do
            status=$(curl --max-time 55 -s -o /tmp/response.json -w "%{http_code}" \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
              https://ipobharosa.vercel.app/api/cron/ingest)
            echo "Step $attempt — HTTP $status"
            cat /tmp/response.json
            if [ "$status" -ne 200 ]; then
              echo "Ingestion step failed; the persisted cursor will resume safely on retry"
              exit 1
            fi
            if jq -e '.complete == true' /tmp/response.json >/dev/null; then
              echo "Ingestion cycle complete"
              exit 0
            fi
          done
          echo "Ingestion did not complete within 50 bounded steps"
          exit 1
