name: IPO data ingestion

on:
  schedule:
    # Every hour. Vercel's free Hobby plan only allows daily native
    # cron jobs, so this runs on GitHub Actions' free scheduler instead
    # and just hits the deployed, CRON_SECRET-protected API route.
    - cron: "0 * * * *"
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: production-ingestion
      cancel-in-progress: false
    steps:
      - name: Trigger ingestion cycle
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://ipodekho-ten.vercel.app' }}
        run: |
          # A full run currently needs one bounded request per batch plus
          # preparation/finalization. Keep enough headroom for fleet growth and
          # source retries while the job timeout remains the hard upper bound.
          for attempt in $(seq 1 120); do
            if ! status=$(curl --max-time 55 -s -o /tmp/response.json -w "%{http_code}" \
                -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
                "$SITE_URL/api/cron/ingest"); then
              echo "Step $attempt — transport failure; persisted cursor is unchanged"
              # Do not let curl launch a duplicate while a timed-out serverless
              # invocation may still be finishing and holding the DB mutex.
              sleep 5
              continue
            fi
            echo "Step $attempt — HTTP $status"
            cat /tmp/response.json
            if [ "$status" -eq 408 ] || [ "$status" -eq 425 ] || [ "$status" -eq 429 ] || [ "$status" -ge 500 ]; then
              echo "Transient HTTP failure; retrying the same persisted step"
              sleep 2
              continue
            fi
            if [ "$status" -ne 200 ]; then
              echo "Permanent HTTP failure; stopping without advancing the persisted cursor"
              exit 1
            fi
            if jq -e '.checkpoint.summary.skippedDueToLock == true' /tmp/response.json >/dev/null; then
              echo "Another invocation still owns the ingestion lock; waiting before retry"
              sleep 5
              continue
            fi
            if jq -e '.complete == true' /tmp/response.json >/dev/null; then
              echo "Ingestion cycle complete"
              exit 0
            fi
          done
          echo "Ingestion did not complete within 120 bounded steps"
          exit 1
