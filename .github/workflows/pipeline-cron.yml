name: Pipeline Cron

on:
  schedule:
    - cron: '0 * * * *'      # Ingest: every hour
    - cron: '0 0 * * *'      # Catalogues: daily midnight
    - cron: '0 */2 * * *'    # Allotment: every 2 hours
    - cron: '0 9 * * *'      # Daily push: 9am IST (3:30 UTC)
    - cron: '0 2 * * *'      # Filings: daily 2am
  workflow_dispatch:

jobs:
  ingest:
    if: github.event.schedule == '0 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Run Ingest
        run: |
          curl -s -o /dev/null -w "Ingest: %{http_code}\n" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://ipobharosa.vercel.app/api/cron/ingest"

  catalogues:
    if: github.event.schedule == '0 0 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Refresh Catalogues
        run: |
          curl -s -o /dev/null -w "Catalogues: %{http_code}\n" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://ipobharosa.vercel.app/api/cron/refresh-catalogues"

  allotment:
    if: github.event.schedule == '0 */2 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Check Allotment
        run: |
          curl -s -o /dev/null -w "Allotment: %{http_code}\n" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://ipobharosa.vercel.app/api/cron/allotment-launch"

  daily-push:
    if: github.event.schedule == '0 9 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Daily Push
        run: |
          curl -s -o /dev/null -w "Push: %{http_code}\n" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://ipobharosa.vercel.app/api/cron/daily-push"

  filings:
    if: github.event.schedule == '0 2 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Filing Evidence
        run: |
          curl -s -o /dev/null -w "Filings: %{http_code}\n" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://ipobharosa.vercel.app/api/cron/filing-evidence"
