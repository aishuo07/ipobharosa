name: Official filing evidence capture

on:
  schedule:
    # Remote PDFs are intentionally outside the hourly market-data cycle.
    # Capture immutable evidence first; the financial extractor runs at 01:30 UTC.
    - cron: "45 0 * * *"
  workflow_dispatch: {}

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: production-filing-evidence
      cancel-in-progress: false
    steps:
      - name: Capture bounded official filing evidence
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://ipodekho-ten.vercel.app' }}
        run: |
          for attempt in $(seq 1 30); do
            if ! status=$(curl --max-time 55 -s -o /tmp/response.json -w "%{http_code}" \
                -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
                "$SITE_URL/api/cron/filing-evidence"); then
              echo "Capture $attempt — transport timeout; waiting for the document lock"
              sleep 5
              continue
            fi
            echo "Capture $attempt — HTTP $status"
            cat /tmp/response.json
            if [ "$status" -eq 408 ] || [ "$status" -eq 425 ] || [ "$status" -eq 429 ] || [ "$status" -ge 500 ]; then
              echo "Transient endpoint failure; retrying"
              sleep 3
              continue
            fi
            if [ "$status" -ne 200 ]; then
              echo "Permanent endpoint failure"
              exit 1
            fi
            if jq -e '.skippedDueToLock == true' /tmp/response.json >/dev/null; then
              sleep 5
              continue
            fi
            if jq -e '.complete == true' /tmp/response.json >/dev/null; then
              echo "No filing is currently ready; deferred failures retain their retry time"
              exit 0
            fi
          done
          echo "Daily safety budget reached; remaining evidence continues tomorrow"
