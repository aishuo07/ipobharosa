name: Production health monitor

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: production-health-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Probe Production
        id: probe
        continue-on-error: true
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://ipobharosa.vercel.app' }}
        run: node scripts/check-production-health.mjs

      - name: Open one deduplicated incident
        if: steps.probe.outcome == 'failure'
        uses: actions/github-script@v8
        with:
          script: |
            const title = "[monitor] IPOBharosa Production health degraded";
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            if (!issues.some((issue) => issue.title === title && !issue.pull_request)) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: `The external Production probe failed. Review the run before retrying or changing data: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              });
            }

      - name: Close the incident after recovery
        if: steps.probe.outcome == 'success'
        uses: actions/github-script@v8
        with:
          script: |
            const title = "[monitor] IPOBharosa Production health degraded";
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            for (const issue of issues.filter((item) => item.title === title && !item.pull_request)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `Production recovered in ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}. Closing the automated incident.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed",
              });
            }

      - name: Keep the workflow red while degraded
        if: steps.probe.outcome == 'failure'
        run: exit 1
