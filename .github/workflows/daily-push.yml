name: Daily IPO push

on:
  schedule:
    # 8:00 AM IST = 02:30 UTC. Broadcasts "today's IPOs" (openings,
    # closings, allotments, listings + open issues) to every installed app.
    # Runs on GitHub Actions' free scheduler and hits the deployed,
    # CRON_SECRET-protected route; PushBroadcast dedup means it fires at
    # most once per calendar day.
    - cron: "30 2 * * *"
  workflow_dispatch: {}

jobs:
  daily-push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger daily IPO push
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://ipobharosa.vercel.app' }}
        run: |
          for attempt in $(seq 1 10); do
            status=$(curl --max-time 55 -s -o /tmp/response.json -w "%{http_code}" \
                -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
                "$SITE_URL/api/cron/daily-push")
            echo "Attempt $attempt — HTTP $status"
            cat /tmp/response.json
            echo
            if [ "$status" -eq 200 ]; then
              echo "Daily push complete"
              exit 0
            fi
            sleep 5
          done
          echo "Daily push did not succeed after retries"
          exit 1