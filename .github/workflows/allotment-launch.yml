name: Allotment launch check

on:
  schedule:
    # Every 30 minutes. Vercel's free Hobby plan only allows one native
    # cron per day, so this runs on GitHub Actions' free scheduler instead
    # and hits the deployed, CRON_SECRET-protected API route.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

jobs:
  allotment-launch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger allotment launch check
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://ipobharosa.vercel.app' }}
        run: |
          for attempt in $(seq 1 10); do
            status=$(curl --max-time 55 -s -o /tmp/response.json -w "%{http_code}" \
                -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
                "$SITE_URL/api/cron/allotment-launch")
            echo "Attempt $attempt — HTTP $status"
            cat /tmp/response.json
            echo
            if [ "$status" -eq 200 ]; then
              echo "Allotment launch check complete"
              exit 0
            fi
            sleep 5
          done
          echo "Allotment launch check did not succeed after retries"
          exit 1